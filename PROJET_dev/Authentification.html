<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Authentification</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>Livraison gratuite dès 500 DH d'achat !</div>
        <header>
            <img src="logo.png" alt="logo de la marque" width="100" height="auto">
            <!-- class avatar ajusté a droite de la barre de navigation -->
            <a href="avatar_utilisateur"><img src="avatar-utilisateur.png" alt="avatar de l'utilisateur" width="24" height="24" class="avatar"></a>
            <a href="avatar_panier"><img src="avatar-panier.png" alt="avatar du panier" width="24" height="24" class="avatar"></a>
        </header>
        <form>
            <label for="username">Nom d'utilisateur :</label>
            <input type="text" id="username" name="username" required>
            <br>
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" required>
            <br>
            <button type="submit">Se connecter</button>
        </form>
    </body>

    <footer>
        <a href="aide">Aide</a>
        <p>Trouvez nous sur:</p>
        <a href="instagram"><img src="instagram.png" alt="avatar d'Instagram" width="24" height="24"></a>
        <a href="facebook"><img src="facebook.png" alt="avatar de Facebook" width="24" height="24"></a>
        <a href="tiktok"><img src="tiktok.png" alt="avatar de TikTok" width="24" height="24"></a>
        <p>&copy; 2024 Nom de la marque. Tous droits réservés.</p>
    </footer>
</html>
