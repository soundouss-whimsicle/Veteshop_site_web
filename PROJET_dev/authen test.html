
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Active | Mon compte</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <a href="index.html" class="logo">AURA ACTIVE</a>
    <a href="index.html" class="back-link">Retour à la boutique</a>
</header>

<main class="auth-container">
    <section class="auth-image">
        <div class="image-text">
            <h1>Feel strong.<br>Look confident.</h1>
            <p>Discover your strength with Aura Active.</p>
        </div>
    </section>

    <section class="auth-form">

        <h2>Welcome to Aura Active</h2>
        <p class="subtitle">Accédez à votre espace personnel</p>

        <div class="tabs">
            <button class="tab active" data-tab="login">Connexion</button>
            <button class="tab" data-tab="register">Inscription</button>
        </div>

        <!-- CONNEXION -->
        <form id="login" class="form active">

            <label>Adresse e-mail</label>
            <input type="email" id="loginEmail"
                   placeholder="exemple@email.com" required>

            <label>Mot de passe</label>
            <div class="password-box">
                <input type="password" id="loginPassword"
                       placeholder="Votre mot de passe" required>
                <button type="button" class="toggle-password"
                        data-target="loginPassword">Afficher</button>
            </div>

            <a href="#" class="forgot">Mot de passe oublié ?</a>

            <button type="submit" class="submit-btn">
                Se connecter
            </button>

        </form>

        <!-- INSCRIPTION -->
        <form id="register" class="form">

            <label>Prénom</label>
            <input type="text" id="firstName"
                   placeholder="Votre prénom" required>

            <label>Nom</label>
            <input type="text" id="lastName"
                   placeholder="Votre nom" required>

            <label>Adresse e-mail</label>
            <input type="email" id="registerEmail"
                   placeholder="exemple@email.com" required>

            <label>Mot de passe</label>
            <div class="password-box">
                <input type="password" id="registerPassword"
                       placeholder="Minimum 8 caractères" required
                       minlength="8">
                <button type="button" class="toggle-password"
                        data-target="registerPassword">Afficher</button>
            </div>

            <label>Confirmer le mot de passe</label>
            <input type="password" id="confirmPassword"
                   placeholder="Confirmez votre mot de passe" required>

            <label class="terms">
                <input type="checkbox" id="terms" required>
                J'accepte les conditions générales.
            </label>

            <button type="submit" class="submit-btn">
                Créer mon compte
            </button>

        </form>

        <p id="message" role="status"></p>

        <p class="footer-text">
            STRONG • ELEGANT • YOU
        </p>

    </section>

</main>

<script src="js/script.js"></script>
</body>
</html>
