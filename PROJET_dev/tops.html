<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>TOPS</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div>Livraison gratuite dès 500 DH d'achat !</div>
        <header>
            <img src="logo.png" alt="logo de la marque" width="100" height="auto">
            <!-- class avatar ajusté a droite de la barre de navigation -->
            <a href="Authentification.html"><img src="avatar-utilisateur.png" alt="avatar de l'utilisateur" width="24" height="24" class="avatar"></a>
            <a href="panier.html"><img src="avatar-panier.png" alt="avatar du panier" width="24" height="24" class="avatar"></a>
        </header>

        <nav>
            <p>Menu</p>
            <ul>
                <li><a href="Acceuil.html">Accueil</a></li>
                <li>Catégories</li>
                <li><a href="Acceuil.html">Sets</a></li>
                <li><a href="tops.html">Tops</a></li>
                <li><a href="buttoms.html">bottoms</a></li>
            </ul>
        </nav>

        <form id="formRecherche">
            <input type="search" id="rechercheProduits" placeholder="Rechercher" aria-label="Rechercher un produit">
            <a href="#" id="boutonRecherche"><img src="avatar-recherche.png" alt="Lancer la recherche" width="24" height="24"></a>
        </form>
        <main class="catalogue-layout">
            <aside class="filtresCatalogue" aria-label="Filtres des produits">
                <h2>Filtres</h2>
                <label for="filtreCategorie">Catégorie</label>
                <select id="filtreCategorie">
                    <option value="">Toutes les catégories</option>
                    <option value="Tops">Tops</option>
                    <option value="Bottoms">Bottoms</option>
                </select>

                <label for="prixMinimum">Prix minimum (DH)</label>
                <input type="number" id="prixMinimum" min="0" placeholder="0">
                <label for="prixMaximum">Prix maximum (DH)</label>
                <input type="number" id="prixMaximum" min="0" placeholder="Aucun maximum">

                <fieldset>
                    <legend>Taille</legend>
                    <div id="optionsTaillesFiltres"></div>
                </fieldset>
                <button type="button" id="reinitialiserFiltres">Réinitialiser les filtres</button>
            </aside>

            <section>
                <h2>Haut</h2>
            </section>
        </main>
    </body>
    
    <footer>
        <a href="Acceuil.html">Aide</a>
        <p>Trouvez nous sur:</p>
        <a href="#"><img src="instagram.png" alt="avatar d'Instagram" width="24" height="24"></a>
        <a href="#"><img src="facebook.png" alt="avatar de Facebook" width="24" height="24"></a>
        <a href="#"><img src="tiktok.png" alt="avatar de TikTok" width="24" height="24"></a>
        <p>&copy; 2024 Nom de la marque. Tous droits réservés.</p>
    </footer>
    <script src="produits-test.js" defer></script>
    <script src="catalogue.js" defer></script>
</html>
